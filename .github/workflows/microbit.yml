name: Build microbit firmware

on:
  push:
    branches:
      - del2-microbit
      - main
    paths:
      - "firmware/**"
      - "tests/**"
      - ".github/workflows/microbit.yml"

permissions:
  contents: read

jobs:
  test-monitoring:
    name: Test monitoring logic
    runs-on: ubuntu-24.04

    steps:
      - name: Download our repository
        uses: actions/checkout@v7

      - name: Compile monitoring tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic \
            -I firmware \
            firmware/MonitoringSystem.cpp \
            tests/monitoring_tests.cpp \
            -o "$RUNNER_TEMP/monitoring-tests"

      - name: Run monitoring tests
        run: |
          "$RUNNER_TEMP/monitoring-tests"

  build:
    needs: test-monitoring
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Download our repository
        uses: actions/checkout@v7
        
      - name: Install build tools
        timeout-minutes: 8
        run: |
          sudo apt-get update \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30

          sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            cmake ninja-build

          curl --fail --location --retry 2 \
            --connect-timeout 20 --max-time 180 \
            "https://developer.arm.com/-/media/Files/downloads/gnu/13.3.rel1/binrel/arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi.tar.xz" \
            --output "$RUNNER_TEMP/arm-toolchain.tar.xz"

          mkdir -p "$RUNNER_TEMP/arm-toolchain"

          tar --extract --xz --no-same-owner \
            --file "$RUNNER_TEMP/arm-toolchain.tar.xz" \
            --directory "$RUNNER_TEMP/arm-toolchain" \
            --strip-components=1

          echo "$RUNNER_TEMP/arm-toolchain/bin" >> "$GITHUB_PATH"

          "$RUNNER_TEMP/arm-toolchain/bin/arm-none-eabi-g++" --version

      - name: Download CODAL build project
        run: |
          git clone --depth 1 --branch v0.3.0 \
            https://github.com/lancaster-university/microbit-v2-samples \
            "$RUNNER_TEMP/microbit-build"

      - name: Copy our program into the build project
        run: |
          cp firmware/codal.json "$RUNNER_TEMP/microbit-build/codal.json"
          cp firmware/*.cpp "$RUNNER_TEMP/microbit-build/source/"
          cp firmware/*.h "$RUNNER_TEMP/microbit-build/source/"

      - name: Compile firmware
        run: |
          cd "$RUNNER_TEMP/microbit-build"
          python3 build.py

      - name: Save downloadable firmware
        uses: actions/upload-artifact@v7
        with:
          name: hytte-microbit-firmware
          path: ${{ runner.temp }}/microbit-build/MICROBIT.hex
          if-no-files-found: error