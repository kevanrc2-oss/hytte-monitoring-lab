name: Build microbit firmware

on:
  push:
    branches:
      - del2-microbit
      - main
    paths:
      - "firmware/**"
      - ".github/workflows/microbit.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Download our repository
        uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib

      - name: Download CODAL build project
        run: |
          git clone --depth 1 --branch v0.3.0 \
            https://github.com/lancaster-university/microbit-v2-samples \
            "$RUNNER_TEMP/microbit-build"

      - name: Copy our program into the build project
        run: |
          cp firmware/codal.json "$RUNNER_TEMP/microbit-build/codal.json"
          cp firmware/main.cpp "$RUNNER_TEMP/microbit-build/source/main.cpp"

      - name: Compile firmware
        run: |
          cd "$RUNNER_TEMP/microbit-build"
          python3 build.py

      - name: Save downloadable firmware
        uses: actions/upload-artifact@v7
        with:
          name: hytte-microbit-firmware
          path: ${{ runner.temp }}/microbit-build/MICROBIT.hex
          if-no-files-found: error